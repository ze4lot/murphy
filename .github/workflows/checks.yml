name: Tests and package

on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'build==1.2.2.post1'
      - run: python tests/test_bridge.py
      - run: python tests/test_manager.py
      - run: python tests/check_package.py
      - run: git diff --check
